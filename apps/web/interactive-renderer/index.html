<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      This document runs inside a sandbox="allow-scripts" iframe with NO
      allow-same-origin, so it always has an opaque ("null") origin. CSP
      'self' does not match an opaque origin, so script execution is scoped
      by a build-time SHA-256 hash of the exact bundle.js content instead (a
      fixed/guessable nonce would be no real barrier for a static asset that
      never varies per request; a content hash means any tampering with the
      shipped bundle breaks both the `integrity` check and the CSP match at
      once). Every other network surface is denied outright: no fetch/XHR/
      image/font loads beyond the bundled data: URIs, and no navigation out
      of the frame. No 'unsafe-eval' is granted: the widget manager here is a
      minimal, hand-written implementation (widget-manager.ts) that avoids
      @jupyter-widgets/html-manager's ajv-based RenderMimeRegistry, which
      would otherwise require it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src '__BUNDLE_SCRIPT_HASH__'; style-src 'unsafe-inline'; style-src-elem 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotebookLens interactive output renderer</title>
    <link rel="stylesheet" href="./bundle.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #0f172a;
        overflow-y: auto;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      #root {
        min-height: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin="anonymous" integrity="__BUNDLE_SCRIPT_HASH__" src="./bundle.js"></script>
  </body>
</html>
